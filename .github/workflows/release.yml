name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          raw="${INPUT_VERSION:-$REF_NAME}"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal DMG
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate (optional)
        if: env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          cert="$RUNNER_TEMP/processlink.p12"
          echo -n "$MACOS_CERT_P12" | base64 --decode -o "$cert"
          keychain="$RUNNER_TEMP/processlink.keychain-db"
          password="processlink-ci"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o 'Developer ID Application: [^"]*' | head -1)
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity in the certificate." >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build DMG
        shell: bash
        run: |
          chmod +x macos/ProcessLink/tools/package.sh
          args=(--version "$VERSION" --out "$GITHUB_WORKSPACE/dist")
          if [[ -n "${APPLE_ID:-}" ]]; then args+=(--notarize); fi
          macos/ProcessLink/tools/package.sh "${args[@]}"

      - name: Verify the mounted app
        shell: bash
        run: |
          hdiutil attach -nobrowse -readonly dist/*.dmg
          APP_STORE="$RUNNER_TEMP/processlink.store" APP_MAPS_DIR="$RUNNER_TEMP/processlink-maps" \
            "/Volumes/ProcessLink/ProcessLink.app/Contents/MacOS/ProcessLink" --selftest
          hdiutil detach "/Volumes/ProcessLink" -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  windows:
    name: Windows MSI and NSIS
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/ProcessLink.Windows/src-tauri -> target

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install desktop dependencies
        run: npm install --prefix windows/ProcessLink.Windows

      - name: Set installer version
        shell: pwsh
        run: |
          $path = "windows/ProcessLink.Windows/src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = $env:VERSION
          $json | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 $path

      - name: Build MSI and NSIS installers
        run: npm run build --prefix windows/ProcessLink.Windows

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            windows/ProcessLink.Windows/src-tauri/target/release/bundle/msi/*.msi
            windows/ProcessLink.Windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -lh
          sha256sum *.dmg *.msi *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ProcessLink ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          body: |
            ## Installers

            - **macOS 26+**: `ProcessLink-${{ needs.prepare.outputs.version }}-macOS-universal.dmg`
              Universal (Apple silicon + Intel). The app is ad-hoc signed unless
              the repository has the Developer ID and notarization secrets.
            - **Windows 10/11**: the `.msi` (per-machine) or `-setup.exe` (NSIS).
            - Verify downloads against `SHA256SUMS.txt`.

            The macOS build is a universal Swift binary; the Windows build is a
            Tauri/WebView2 desktop app. Both point at the same ProcessLink
            domain model and release the same version.
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/SHA256SUMS.txt
