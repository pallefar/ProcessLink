[package]
name = "processlink"
version = "0.1.45"
description = "ProcessLink — in-house discovery into TEOA improvement work"
authors = ["TE Operating Advantage"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "processlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
